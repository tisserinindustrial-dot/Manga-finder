<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mangafinder</title>
<style>
body{margin:0;background:#08080b;color:#fff;font-family:Arial,sans-serif}header{padding:16px;position:sticky;top:0;background:#0b0b10;border-bottom:1px solid #292932;z-index:2}.logo{font-weight:800;font-size:22px}.welcome{text-align:center;padding:28px 16px}.welcome h1{color:#39ff6a}.feed{max-width:650px;margin:auto;padding:10px 14px 80px}.post{background:#15151c;border-radius:16px;margin:14px 0;overflow:hidden}.head{display:flex;gap:10px;padding:12px}.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#292934;display:grid;place-items:center}.media{width:100%;max-height:560px;object-fit:cover}.body{padding:10px 14px}.actions{display:flex;gap:22px;padding:12px 14px}.actions button{background:none;color:#ddd;border:0;font-size:16px}.actions .active{color:#ff4d88}.empty{text-align:center;color:#aaa;padding:40px 10px}nav{position:fixed;bottom:0;left:0;right:0;background:#111118;border-top:1px solid #292932;display:flex;justify-content:space-around;padding:10px;z-index:3}nav button{background:none;color:white;border:0}.panel{position:fixed;inset:0;background:#08080b;z-index:5;padding:18px;overflow:auto}.panel input,.panel textarea,.panel select{width:100%;box-sizing:border-box;margin:7px 0;padding:12px;border-radius:10px;background:#15151c;color:white;border:1px solid #333}.primary,.secondary{padding:12px 16px;border-radius:10px;border:0}.primary{background:#8b5cf6;color:#fff}.secondary{background:#292932;color:#fff}.close{float:right;background:#292932;color:#fff;border:0;border-radius:8px;padding:8px}.hidden{display:none}
</style></head><body>
<header><div class="logo">mangafinder</div></header>
<section class="welcome"><h1>BIENVENUE SUR MANGAFINDER</h1><p>Scrolle pour découvrir des mangas, dessins et vidéos.</p></section>
<main id="feed" class="feed"></main>
<nav><button onclick="render()">🏠<br>Accueil</button><button onclick="publish()">➕<br>Publier</button><button onclick="profile()">👤<br>Moi</button></nav>
<div id="panel" class="panel hidden"></div>
<script>
const S={user:JSON.parse(localStorage.getItem("mf_user")||"null"),posts:JSON.parse(localStorage.getItem("mf_posts")||"[]"),likes:JSON.parse(localStorage.getItem("mf_likes")||"{}"),comments:JSON.parse(localStorage.getItem("mf_comments")||"{}")};
function save(){for(const k in S)localStorage.setItem("mf_"+k,JSON.stringify(S[k]))}
function esc(x){return String(x||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function panel(x){let p=document.getElementById("panel");p.innerHTML=x;p.classList.remove("hidden")}function closePanel(){document.getElementById("panel").classList.add("hidden")}
function render(){let f=document.getElementById("feed");if(!S.posts.length){f.innerHTML='<div class="empty">Aucune publication pour le moment.<br>Publie le premier contenu.</div>';return}f.innerHTML=S.posts.map(p=>{let n=(S.likes[p.id]||[]).length,c=(S.comments[p.id]||[]).length,l=S.user&&(S.likes[p.id]||[]).includes(S.user.id);return '<article class="post"><div class="head"><div class="avatar">👤</div><div><b>'+esc(p.author)+'</b><br><small>'+esc(p.type)+'</small></div></div>'+ (p.type==="video"?'<video class="media" controls src="'+p.url+'"></video>':'<img class="media" src="'+p.url+'" alt="">')+'<div class="body"><h3>'+esc(p.title)+'</h3><div>'+esc(p.description)+'</div></div><div class="actions"><button class="'+(l?"active":"")+'" onclick="like(\''+p.id+'\')">♥'+(n?" "+n:"")+'</button><button onclick="comments(\''+p.id+'\')">💬'+(c?" "+c:"")+'</button></div></article>'}).join("")}
function auth(){panel('<button class="close" onclick="closePanel()">Fermer</button><h2>Créer un compte MangaFinder</h2><input id="u" placeholder="Nom d’utilisateur"><input id="e" type="email" placeholder="Email"><input id="a" type="file" accept="image/*"><button class="primary" onclick="signup()">Créer le compte</button>')}
function signup(){let u=document.getElementById("u").value.trim(),e=document.getElementById("e").value.trim();if(!u||!e)return alert("Nom et email obligatoires");S.user={id:Date.now().toString(),username:u,email:e};save();closePanel();profile()}
function profile(){if(!S.user){auth();return}panel('<button class="close" onclick="closePanel()">Fermer</button><h2>@'+esc(S.user.username)+'</h2><p>'+esc(S.user.email)+'</p><p>Publications : '+S.posts.filter(p=>p.authorId===S.user.id).length+'</p><button class="secondary" onclick="logout()">Se déconnecter</button>')}
function logout(){S.user=null;save();closePanel();render()}
function publish(){if(!S.user){auth();return}panel('<button class="close" onclick="closePanel()">Fermer</button><h2>Publier</h2><select id="t"><option>manga</option><option>drawing</option><option>video</option></select><input id="title" placeholder="Titre"><textarea id="desc" placeholder="Description"></textarea><input id="file" type="file" accept="image/*,video/*"><button class="primary" onclick="post()">Publier</button>')}
function post(){let f=document.getElementById("file").files[0],t=document.getElementById("title").value.trim();if(!f||!t)return alert("Titre et fichier obligatoires");let r=new FileReader();r.onload=()=>{S.posts.unshift({id:Date.now().toString(),authorId:S.user.id,author:S.user.username,type:document.getElementById("t").value,title:t,description:document.getElementById("desc").value,url:r.result});save();closePanel();render()};r.readAsDataURL(f)}
function like(id){if(!S.user){auth();return}let a=S.likes[id]||[],i=a.indexOf(S.user.id);i<0?a.push(S.user.id):a.splice(i,1);S.likes[id]=a;save();render()}
function comments(id){let a=S.comments[id]||[];panel('<button class="close" onclick="closePanel()">Fermer</button><h2>Commentaires</h2>'+(a.length?a.map(x=>'<p><b>'+esc(x.user)+'</b><br>'+esc(x.text)+'</p>').join(""):'<div class="empty">Aucun commentaire.</div>')+(S.user?'<input id="ct" placeholder="Écrire un commentaire"><button class="primary" onclick="comment(\''+id+'\')">Commenter</button>':'<p>Connecte-toi pour commenter.</p>'))}
function comment(id){let x=document.getElementById("ct").value.trim();if(!x)return;(S.comments[id]||(S.comments[id]=[])).push({user:S.user.username,text:x});save();comments(id);render()}
render();
</script></body></html>
